# dsh-auto-effort —— DSH bundle 补丁。
#
# 本文件只插入一行：把「推理等级 auto」挂到 Host 根部。
#
# 为什么挂在根、而不是某个 preset 里：
#   * `llm/stream` 是所有模型调用都会经过的那条瀑布。挂在根部，一份判定服务所有
#     preset、所有会话、所有子代理，行为一致。
#   * 判定是纯规则、0 token、0 往返，不产生额外调用；挂在根上也不会因为"谁先加载"
#     而出现两种行为。
#
# 这一行不注册任何工具、不改消息、不改系统提示、不改采样参数：它只决定「这一次
# 调用用多强的推理」。
#
# 默认值刻意保守：
#   * mode: auto      —— 每次请求判定（需求指定的默认档）。
#   * enabled: true   —— 首次启动就是自动；关掉只需点一下胶囊。
#   * minTier/maxTier —— 不设人为上下限，判到什么用什么。
#   * effortFloor: observed   —— **手选的档位不许被降**。请求上带着真实档位（你在列表里
#     选的 low/high/max）时，它就是下界；虚拟档位 auto 不算真实档位，判定照常接管。
#     这是实测教训：早先默认 off，手选 high 会被一句"你好"降成 off。
#   * effortCeiling: max      —— 不设人为上限：只有真的需要多想时才升到 max。

- insert:
    - id: auto-effort
      name: 'dsh-auto-effort'
      config:
        # 默认关闭：先用它做 A/B 验证（关掉后若仍卡死，就与本插件无关）。
        # 「优化」面板里点一下即可开回来，不需要改这个文件。
        mode: auto
        enabled: false
        persist: true
        minTier: 'off'
        maxTier: max
        effortFloor: observed
        effortCeiling: max
        log: true
